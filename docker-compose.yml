# NGAO360 deployment stack: Postgres (RLS), Redis, MinIO, API, web, Caddy, and optionally clamd.
#   cp .env.docker.example .env.docker   # set real secrets
#   docker compose --env-file .env.docker up -d --build
# Malware scanning (recommended before any pilot): set MALWARE_SCANNER=clamd in .env.docker and add
# `--profile scanner` so the clamd service runs. Without it uploads stay PENDING and nothing that
# needs a clean scan (public project documents and photos, ledger approval) can proceed.
# Separate staging/production with distinct project names (-p) and env files. The hardened production
# stack (separate worker, Object Lock originals, read-only containers) is docker-compose.prod.yml.
name: ngao360

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://ngao:${POSTGRES_PASSWORD}@postgres:5432/ngao360?schema=public
  APP_DATABASE_URL: postgresql://ngao_app:${NGAO_APP_DB_PASSWORD}@postgres:5432/ngao360?schema=public
  REDIS_URL: redis://redis:6379
  QUEUES_ENABLED: "true"
  API_PORT: "4000"
  API_PUBLIC_URL: https://${NGAO_DOMAIN:-localhost}
  WEB_ORIGIN: https://${NGAO_DOMAIN:-localhost}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  COOKIE_SECURE: "true"
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-ngao360}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: "true"
  # Originals are written with COMPLIANCE retention; the bucket is created with Object Lock.
  S3_OBJECT_LOCK_MODE: COMPLIANCE
  S3_OBJECT_LOCK_DAYS: ${S3_OBJECT_LOCK_DAYS:-2555}
  # Pilot hardening: secrets from .env.docker; every provider defaults to the log / no-op one.
  MESSAGING_ENCRYPTION_KEY: ${MESSAGING_ENCRYPTION_KEY:?set MESSAGING_ENCRYPTION_KEY}
  MESSAGING_HASH_KEY: ${MESSAGING_HASH_KEY:?set MESSAGING_HASH_KEY}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-log}
  AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
  AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
  AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
  AFRICASTALKING_DLR_TOKEN: ${AFRICASTALKING_DLR_TOKEN:-}
  PUSH_PROVIDER: ${PUSH_PROVIDER:-log}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  AFRICASTALKING_BASE_URL: ${AFRICASTALKING_BASE_URL:-https://api.africastalking.com}
  MESSAGING_DISPATCH_INTERVAL_SECONDS: ${MESSAGING_DISPATCH_INTERVAL_SECONDS:-30}
  MESSAGING_MAX_ATTEMPTS: ${MESSAGING_MAX_ATTEMPTS:-5}
  MALWARE_SCANNER: ${MALWARE_SCANNER:-none}
  CLAMD_HOST: ${CLAMD_HOST:-clamd}
  CLAMD_PORT: ${CLAMD_PORT:-3310}
  CLAMD_TIMEOUT_MS: ${CLAMD_TIMEOUT_MS:-30000}
  SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-60}
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
  CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
  CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
  CAPTCHA_TIMEOUT_MS: ${CAPTCHA_TIMEOUT_MS:-5000}
  # Rate-limit counters and durable jobs live in Redis (shared by every API instance).
  RATE_LIMIT_STORE: redis
  JOBS_ENABLED: "true"
  WEBAUTHN_RP_ID: ${NGAO_DOMAIN:-localhost}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ngao360
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      NGAO_APP_DB_PASSWORD: ${NGAO_APP_DB_PASSWORD:?set NGAO_APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngao -d ngao360"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the private bucket once, with Object Lock (implies versioning) and default retention.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-ngao360}
      S3_OBJECT_LOCK_DAYS: ${S3_OBJECT_LOCK_DAYS:-2555}
    entrypoint: >
      /bin/sh -c "
      mc alias set ngao http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing --with-lock ngao/$${S3_BUCKET} &&
      mc retention set --default COMPLIANCE $${S3_OBJECT_LOCK_DAYS}d ngao/$${S3_BUCKET} &&
      mc anonymous set none ngao/$${S3_BUCKET}"
    restart: "no"

  # One-shot: apply Prisma migrations (incl. RLS) as the schema owner.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ngao360-migrate:latest
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Single container running HTTP and the BullMQ workers (PROCESS_ROLE=all). For a separate worker,
  # read-only containers and an Object Lock bucket use docker-compose.prod.yml.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    image: ngao360-api:latest
    restart: unless-stopped
    environment:
      <<: *api-env
      PROCESS_ROLE: all
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamd:
        condition: service_healthy
        required: false

  # ClamAV daemon for MALWARE_SCANNER=clamd (profile "scanner"). Signatures are refreshed by the
  # image's freshclam and kept in a volume; the first start downloads them (a few minutes).
  clamd:
    image: clamav/clamav:1.4.3
    profiles: ["scanner"]
    restart: unless-stopped
    environment:
      # Uploads are at most 25 MB; leave headroom for the INSTREAM framing.
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMD_CONF_MaxFileSize: 30M
      CLAMD_CONF_MaxScanSize: 100M
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    image: ngao360-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGAO_DOMAIN: ${NGAO_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  clamdb:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
