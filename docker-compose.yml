# NGAO360 deployment stack: Postgres (RLS), Redis, MinIO, API, web, Caddy.
#   cp .env.docker.example .env.docker   # set real secrets
#   docker compose --env-file .env.docker up -d --build
# Separate staging/production with distinct project names (-p) and env files.
name: ngao360

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://ngao:${POSTGRES_PASSWORD}@postgres:5432/ngao360?schema=public
  APP_DATABASE_URL: postgresql://ngao_app:${NGAO_APP_DB_PASSWORD}@postgres:5432/ngao360?schema=public
  REDIS_URL: redis://redis:6379
  QUEUES_ENABLED: "true"
  API_PORT: "4000"
  API_PUBLIC_URL: https://${NGAO_DOMAIN:-localhost}
  WEB_ORIGIN: https://${NGAO_DOMAIN:-localhost}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  COOKIE_SECURE: "true"
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-ngao360}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ngao360
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      NGAO_APP_DB_PASSWORD: ${NGAO_APP_DB_PASSWORD:?set NGAO_APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngao -d ngao360"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the private, versioned bucket once.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-ngao360}
    entrypoint: >
      /bin/sh -c "
      mc alias set ngao http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing ngao/$${S3_BUCKET} &&
      mc anonymous set none ngao/$${S3_BUCKET} &&
      mc version enable ngao/$${S3_BUCKET}"
    restart: "no"

  # One-shot: apply Prisma migrations (incl. RLS) as the schema owner.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ngao360-api:latest
    command: ["sh", "-c", "cd /repo/packages/db && npx prisma migrate deploy"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ngao360-api:latest
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    image: ngao360-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGAO_DOMAIN: ${NGAO_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
