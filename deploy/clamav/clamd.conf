# clamd configuration for docker-compose.prod.yml (mounted read-only over the image default).
# Fail closed: content clamd could not fully scan is REPORTED (a "Heuristics.Limits.Exceeded"
# FOUND reply, which the API records as INFECTED), never passed as "stream: OK".
Foreground yes
LogTime yes
LogFile /dev/stdout
LogVerbose no
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav

# Size limits. The API accepts originals up to 25 MiB (MAX_SOURCE_FILE_BYTES); the stream limit
# must stay above that, or every maximum-size upload would be refused with an ERROR.
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 30M
MaxHTMLNormalize 10M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M

# Alert instead of silently passing what could not be scanned or is suspicious.
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertBrokenMedia no
AlertOLE2Macros yes
AlertPhishingSSLMismatch no
AlertPhishingCloak no
ScanPE yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes

# Reload new signatures in place instead of building a second copy first. This halves clamd's peak
# memory (about 1.5 GB instead of 3 GB) at the cost of a short pause in scanning during each reload;
# uploads wait in the scan queue meanwhile, so nothing is lost.
ConcurrentDatabaseReload no
