name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ngao:ngao_dev_owner@localhost:5432/ngao360_test?schema=public
      APP_DATABASE_URL: postgresql://ngao_app:ngao_dev_app@localhost:5432/ngao360_test?schema=public
      TEST_DATABASE_URL: postgresql://ngao:ngao_dev_owner@localhost:5432/ngao360_test?schema=public
      TEST_APP_DATABASE_URL: postgresql://ngao_app:ngao_dev_app@localhost:5432/ngao360_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f scripts/db-bootstrap.sql

      - name: Migrate test database (includes RLS policies)
        run: pnpm --filter @ngao360/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Seed (smoke)
        env:
          MFA_ENCRYPTION_KEY: ZGV2LW1mYS1rZXktMzItYnl0ZXMtbG9uZy0hISEhISE=
        run: pnpm --filter @ngao360/db exec tsx src/seed/index.ts

      - name: Build
        run: pnpm build
