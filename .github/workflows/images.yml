name: Images

# Builds the production images and publishes them to GitHub Container Registry, so servers only pull
# finished images (no building on the server). Runs after CI passes on main, on version tags, and on
# demand. Tags: sha-<short>, plus `latest` for main and the version for a v* tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build linux/arm64 (for ARM servers such as Oracle Ampere); much slower
        type: boolean
        default: false

concurrency:
  group: images-${{ github.ref }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    # After CI: only when CI succeeded on a push to main.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, context: ., target: api }
          - { name: worker, file: apps/api/Dockerfile, context: ., target: worker }
          - { name: migrate, file: apps/api/Dockerfile, context: ., target: migrate }
          - { name: web, file: apps/web/Dockerfile, context: ., target: "" }
          - { name: backup, file: deploy/backup/Dockerfile, context: deploy/backup, target: "" }
          - { name: minio, file: deploy/minio/Dockerfile, context: deploy/minio, target: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ngao360-${{ matrix.name }}"
          sha="$(git rev-parse --short=7 HEAD)"
          tags="${image}:sha-${sha}"
          if [ "${{ matrix.name }}" = "minio" ]; then
            release="$(sed -n 's/^ARG MINIO_RELEASE=//p' deploy/minio/Dockerfile)"
            tags="${tags},${image}:${release}"
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*) tags="${tags},${image}:${GITHUB_REF#refs/tags/}" ;;
            *) tags="${tags},${image}:latest" ;;
          esac
          platforms="linux/amd64"
          if [ "${{ inputs.arm64 }}" = "true" ]; then platforms="linux/amd64,linux/arm64"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: contains(steps.meta.outputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
