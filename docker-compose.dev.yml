# Local infrastructure only (Postgres, Redis, MinIO), for developers who prefer
# Docker over local binaries. Run the apps with `pnpm dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: ngao360-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngao360
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ngao_dev_owner
      NGAO_APP_DB_PASSWORD: ngao_dev_app
    ports: ["5433:5432"]
    volumes:
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ngao
      MINIO_ROOT_PASSWORD: ngao_dev_minio
    ports: ["9000:9000", "9001:9001"]
