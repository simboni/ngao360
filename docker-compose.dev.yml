# Local infrastructure only (Postgres, Redis), for developers who prefer Docker over local binaries.
# Run the apps with `pnpm dev`. Local file storage needs no object store (STORAGE_DRIVER=local).
#   docker compose -f docker-compose.dev.yml up -d
# The demo database lives in the `pgdata` volume, so `down` keeps it; `down -v` deletes it.
# MinIO is optional (profile "s3") for trying STORAGE_DRIVER=s3 locally. It is built from source
# (deploy/minio/Dockerfile) because MinIO no longer publishes free images; the first build takes a few minutes.
#   docker compose -f docker-compose.dev.yml --profile s3 up -d
name: ngao360-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngao360
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ngao_dev_owner
      NGAO_APP_DB_PASSWORD: ngao_dev_app
    ports: ["5433:5432"]
    volumes:
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    profiles: ["s3"]
    image: ngao360-minio:dev
    build:
      context: deploy/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ngao
      MINIO_ROOT_PASSWORD: ngao_dev_minio
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
