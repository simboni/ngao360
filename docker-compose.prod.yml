# NGAO360 production stack (single host): Postgres (RLS), Redis, MinIO with an Object Lock bucket
# for originals, clamd, a one-shot migration, the API (HTTP only), a separate background worker,
# the web app and Caddy for TLS.
#
#   cp deploy/env.prod.example .env.prod      # fill in every secret (never commit it)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Hardening in this file:
#   - application containers run as the unprivileged `node` user with a read-only root filesystem,
#     no Linux capabilities and no-new-privileges; /tmp is a small tmpfs
#   - the API and worker connect only as the runtime RLS role (ngao_app); migrations run as the
#     non-superuser schema owner ngao_owner in the one-shot `migrate` container; the Postgres
#     superuser password is used by nobody but an administrator
#   - only Caddy publishes ports; Postgres, Redis, MinIO and clamd sit on the internal `backend`
#     network (no route to the internet), the API and worker reach vendors through `egress`
#   - the API runs PROCESS_ROLE=api (no BullMQ workers); `worker` runs every processor and job
#   - the API uses a scoped MinIO user without delete permission; originals are written with
#     COMPLIANCE Object Lock retention (S3_OBJECT_LOCK_DAYS) and the bucket's default retention
#   - clamd always runs (MALWARE_SCANNER=clamd): uploads stay PENDING while it is unavailable
#   - Redis requires a password and keeps an append-only file
# Docker is not available in the build environment: this file and the Dockerfiles were linted
# (hadolint; compose files checked against the compose-spec JSON schema) but never built or started.
# `docker compose config` was not run. See docs/OPERATIONS.md.
name: ngao360-prod

x-app-security: &app-security
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "10" }

x-api-env: &api-env
  NODE_ENV: production
  # The API and worker only ever hold the runtime RLS role: DATABASE_URL is the same as
  # APP_DATABASE_URL here. The schema owner URL is given to the one-shot `migrate` service only.
  DATABASE_URL: postgresql://ngao_app:${NGAO_APP_DB_PASSWORD:?set NGAO_APP_DB_PASSWORD}@postgres:5432/ngao360?schema=public&connection_limit=${APP_DB_POOL_SIZE:-20}
  APP_DATABASE_URL: postgresql://ngao_app:${NGAO_APP_DB_PASSWORD:?set NGAO_APP_DB_PASSWORD}@postgres:5432/ngao360?schema=public&connection_limit=${APP_DB_POOL_SIZE:-20}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  QUEUES_ENABLED: "true"
  JOBS_ENABLED: "true"
  API_PORT: "4000"
  API_PUBLIC_URL: https://${NGAO_DOMAIN:?set NGAO_DOMAIN}
  WEB_ORIGIN: https://${NGAO_DOMAIN}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  COOKIE_SECURE: "true"
  # Passkeys are bound to this domain. Use the registrable domain (ngao360.co.ke) so passkeys keep
  # working if the app later moves between subdomains; staging uses its own host name.
  WEBAUTHN_RP_ID: ${NGAO_WEBAUTHN_RP_ID:-${NGAO_DOMAIN}}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-ngao360-originals}
  S3_ACCESS_KEY_ID: ${S3_APP_ACCESS_KEY_ID:?set S3_APP_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_APP_SECRET_ACCESS_KEY:?set S3_APP_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "true"
  S3_OBJECT_LOCK_MODE: ${S3_OBJECT_LOCK_MODE:-COMPLIANCE}
  S3_OBJECT_LOCK_DAYS: ${S3_OBJECT_LOCK_DAYS:-2555}
  RATE_LIMIT_STORE: redis
  MESSAGING_ENCRYPTION_KEY: ${MESSAGING_ENCRYPTION_KEY:?set MESSAGING_ENCRYPTION_KEY}
  MESSAGING_HASH_KEY: ${MESSAGING_HASH_KEY:?set MESSAGING_HASH_KEY}
  # Providers default to the log / no-op one; see .env.example for every variable.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-log}
  AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
  AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
  AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
  AFRICASTALKING_DLR_TOKEN: ${AFRICASTALKING_DLR_TOKEN:-}
  CITIZEN_SMS_ALLOWED_PREFIXES: ${CITIZEN_SMS_ALLOWED_PREFIXES:-+254}
  CITIZEN_MESSAGES_PER_DESTINATION_PER_DAY: ${CITIZEN_MESSAGES_PER_DESTINATION_PER_DAY:-3}
  CITIZEN_SMS_DAILY_BUDGET_PER_TENANT: ${CITIZEN_SMS_DAILY_BUDGET_PER_TENANT:-200}
  AFRICASTALKING_BASE_URL: ${AFRICASTALKING_BASE_URL:-https://api.africastalking.com}
  PUSH_PROVIDER: ${PUSH_PROVIDER:-log}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  MESSAGING_DISPATCH_INTERVAL_SECONDS: ${MESSAGING_DISPATCH_INTERVAL_SECONDS:-30}
  MESSAGING_MAX_ATTEMPTS: ${MESSAGING_MAX_ATTEMPTS:-5}
  MALWARE_SCANNER: clamd
  CLAMD_HOST: clamd
  CLAMD_PORT: "3310"
  CLAMD_TIMEOUT_MS: ${CLAMD_TIMEOUT_MS:-30000}
  SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-60}
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
  CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
  CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
  CAPTCHA_TIMEOUT_MS: ${CAPTCHA_TIMEOUT_MS:-5000}
  # Read-path caches (docs/OPERATIONS.md); set MAX_STALE to 5 for election night (RUNBOOKS §4).
  TALLY_AGGREGATE_CACHE_SECONDS: ${TALLY_AGGREGATE_CACHE_SECONDS:-30}
  TALLY_AGGREGATE_MAX_STALE_SECONDS: ${TALLY_AGGREGATE_MAX_STALE_SECONDS:-0}
  FIELD_WARROOM_CACHE_SECONDS: ${FIELD_WARROOM_CACHE_SECONDS:-15}
  # Raise for election day when many agents share carrier NAT addresses (RUNBOOKS §4).
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}

networks:
  # No route out: databases, cache, object store and scanner.
  backend:
    internal: true
  # Vendors (SMTP, Africa's Talking, captcha, web push) and ACME for Caddy.
  egress: {}
  # Caddy <-> web / api.
  edge: {}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    networks: [backend]
    shm_size: 256m
    environment:
      POSTGRES_DB: ngao360
      POSTGRES_USER: ngao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NGAO_APP_DB_PASSWORD: ${NGAO_APP_DB_PASSWORD}
      # Non-superuser schema owner for migrations and backups (infra/postgres/init-roles.sh).
      NGAO_OWNER_DB_PASSWORD: ${NGAO_OWNER_DB_PASSWORD:?set NGAO_OWNER_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngao -d ngao360"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    networks: [backend]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the Object Lock bucket, its default COMPLIANCE retention and the scoped users.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    networks: [backend]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-ngao360-originals}
      S3_OBJECT_LOCK_MODE: ${S3_OBJECT_LOCK_MODE:-COMPLIANCE}
      S3_OBJECT_LOCK_DAYS: ${S3_OBJECT_LOCK_DAYS:-2555}
      S3_APP_ACCESS_KEY_ID: ${S3_APP_ACCESS_KEY_ID}
      S3_APP_SECRET_ACCESS_KEY: ${S3_APP_SECRET_ACCESS_KEY}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
    volumes:
      - ./deploy/minio:/deploy/minio:ro
    entrypoint: ["/bin/sh", "/deploy/minio/init.sh"]
    restart: "no"

  # ClamAV daemon. The first start downloads signatures (several minutes); until it is healthy,
  # uploads stay PENDING and nothing that needs a CLEAN scan can be published or approved.
  clamd:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    # freshclam needs the internet for signature updates; clamd itself listens on backend only.
    networks: [backend, egress]
    # Explicit configuration (limits, AlertExceedsMax, AlertEncrypted, ...): deploy/clamav/clamd.conf.
    volumes:
      - clamdb:/var/lib/clamav
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3

  # One-shot: apply Prisma migrations (incl. RLS) as the schema owner.
  migrate:
    <<: *app-security
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ngao360-migrate:${NGAO_VERSION:-latest}
    networks: [backend]
    environment:
      <<: *api-env
      # Only this one-shot container gets the schema owner (a non-superuser role).
      DATABASE_URL: postgresql://ngao_owner:${NGAO_OWNER_DB_PASSWORD:?set NGAO_OWNER_DB_PASSWORD}@postgres:5432/ngao360?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-security
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    image: ngao360-api:${NGAO_VERSION:-latest}
    restart: unless-stopped
    networks: [backend, egress, edge]
    environment:
      <<: *api-env
      PROCESS_ROLE: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 1536M }
    stop_grace_period: 30s

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    image: ngao360-worker:${NGAO_VERSION:-latest}
    restart: unless-stopped
    networks: [backend, egress]
    environment:
      <<: *api-env
      PROCESS_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamd:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536M }
    stop_grace_period: 60s

  web:
    <<: *app-security
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    image: ngao360-web:${NGAO_VERSION:-latest}
    restart: unless-stopped
    networks: [edge]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=256m,uid=1000,gid=1000
    environment:
      NODE_ENV: production
    depends_on:
      - api

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    networks: [edge, egress]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NGAO_DOMAIN: ${NGAO_DOMAIN}
      # Comma-separated extra host names that redirect permanently to NGAO_DOMAIN (apex, www).
      NGAO_REDIRECT_DOMAINS: ${NGAO_REDIRECT_DOMAINS:-http://redirect.invalid}
      # Space-separated CIDRs allowed to call the SMS delivery-report webhook (vendor's addresses).
      AT_WEBHOOK_ALLOWED_IPS: ${AT_WEBHOOK_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

  # Nightly logical backup + storage manifest (scripts/ops/backup.sh). Run on demand with
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm backup
  # and schedule it from the host (cron / systemd timer). Copy BACKUP_DIR off the host.
  # The image is built from deploy/backup/Dockerfile (bash and coreutils installed at build time):
  # `backend` has no route out, so nothing can be installed when it runs. Run it from a host timer
  # that alerts on a non-zero exit (docs/RUNBOOKS.md).
  backup:
    build:
      context: deploy/backup
    image: ngao360-backup:${NGAO_VERSION:-latest}
    profiles: ["ops"]
    networks: [backend]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      # The schema owner (not a superuser) can dump every table it owns, RLS included.
      PGUSER: ngao_owner
      PGPASSWORD: ${NGAO_OWNER_DB_PASSWORD:?set NGAO_OWNER_DB_PASSWORD}
      PGDATABASE: ngao360
      BACKUP_DIR: /backups
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ngao360-originals}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
    volumes:
      - ./scripts/ops:/ops:ro
      # Outside the repository checkout, so dumps never enter a build context or a commit.
      - ${BACKUP_HOST_DIR:-/var/lib/ngao360/backups}:/backups
    entrypoint: ["bash", "/ops/backup.sh"]
    restart: "no"

volumes:
  clamdb:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
